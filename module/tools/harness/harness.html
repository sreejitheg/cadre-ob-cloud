<style>body{margin:0;background:#fff;font-family:sans-serif} #cadre-canvas{width:400px;height:300px;overflow:auto;border:1px solid #888;position:relative}
.box{width:160px;height:24px;border:1px dashed #c00;margin:6px}</style>
<script src="vendor/react.js"></script><script src="vendor/react-dom.js"></script>
<script>
// A stub of the Perspective client: only what the module's wrappers use.
window.registry = {};
window.PerspectiveClient = {
  Component: React.Component,
  ComponentRegistry: { register: function (r) { window.registry[r.getComponentType()] = r; } },
};
function makeTree(d) {
  return {
    read: function (n) { return d[n]; },
    readString: function (n, def) { return n in d ? String(d[n]) : def; },
    readNumber: function (n, def) { return n in d ? Number(d[n]) : def; },
    readBoolean: function (n, def) { return n in d ? !!d[n] : def; },
    readArray: function (n, def) { return n in d ? d[n] : def; },
  };
}
// mount(type, rawProps, container, store) -> {rerender(rawProps), unmount()}
window.mount = function (type, raw, container, store) {
  var reg = window.registry[type], View = reg.getViewComponent();
  var root = ReactDOM.createRoot(container);
  function draw(r) {
    var props = reg.getPropsReducer(makeTree(r));
    root.render(React.createElement(View, { props: props, store: store || { props: { write: function () {} } },
      emit: function () { return { className: 'psc-stub', style: { width: '100%', height: '100%' } }; },
      componentEvents: { fireComponentEvent: function (n, p) { (window.fired = window.fired || []).push([n, p]); } } }));
  }
  draw(raw);
  return { rerender: draw, unmount: function () { root.unmount(); } };
};
</script>
